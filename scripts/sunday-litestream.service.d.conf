# Drop-in for sunday.service that wires Litestream durability.
# Install to /etc/systemd/system/sunday.service.d/litestream.conf then
# `systemctl daemon-reload && systemctl restart sunday`.
#
# - After/Wants ensures litestream is up before Sunday starts so the restore
#   call below can reach the live config.
# - The two ExecStartPre lines auto-restore each DB from the S3 replica IF
#   the local file is missing AND a replica exists. Both flags make it
#   idempotent: on a normal restart with DBs present, both no-op instantly.
# - The leading `-` means "don't fail the unit if restore fails" — better to
#   start Sunday with empty DBs than not start at all.

[Unit]
After=litestream.service
Wants=litestream.service

[Service]
ExecStartPre=-/usr/bin/litestream restore -if-replica-exists -if-db-not-exists -config /etc/litestream.yml /root/.sunday/sunday.db
ExecStartPre=-/usr/bin/litestream restore -if-replica-exists -if-db-not-exists -config /etc/litestream.yml /root/.sunday/memories.db
