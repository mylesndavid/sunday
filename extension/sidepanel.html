<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #0e0e12; --bg-2: #16161d; --bg-3: #1d1d27; --border: #2a2a36;
        --text: #ececf2; --muted: #8b8b9a; --ok: #22c55e; --warn: #ffb020;
        --accent: #ff007a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column; }
      .head { display: flex; align-items: center; gap: 8px; padding: 12px 14px;
        border-bottom: 1px solid var(--border); flex: 0 0 auto; }
      .head h1 { font-size: 13px; margin: 0; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: 0 0 auto; }
      .dot.connected { background: var(--ok); }
      .head .state { color: var(--muted); font-size: 11px; margin-left: auto; }

      #transcript { flex: 1 1 auto; overflow-y: auto; padding: 14px; display: flex;
        flex-direction: column; gap: 10px; }
      .msg { max-width: 88%; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap;
        word-wrap: break-word; }
      .msg.user { align-self: flex-end; background: var(--accent); color: #fff;
        border-bottom-right-radius: 4px; }
      .msg.sunday { align-self: flex-start; background: var(--bg-2); border: 1px solid var(--border);
        border-bottom-left-radius: 4px; }
      .msg.system { align-self: center; background: none; color: var(--muted); font-size: 12px;
        text-align: center; padding: 4px 8px; }
      .thinking { align-self: flex-start; color: var(--muted); font-size: 18px; letter-spacing: 2px;
        padding: 2px 11px; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
      .empty { color: var(--muted); font-size: 12px; text-align: center; margin: auto;
        padding: 0 20px; }

      form { flex: 0 0 auto; display: flex; gap: 8px; padding: 10px 12px;
        border-top: 1px solid var(--border); }
      #input { flex: 1; min-width: 0; background: var(--bg-2); color: var(--text);
        border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
        font: inherit; outline: none; resize: none; }
      #input:focus { border-color: var(--muted); }
      #send { background: var(--bg-3); color: var(--text); border: 1px solid var(--border);
        border-radius: 9px; padding: 9px 14px; font: 600 12px/1.4 inherit; cursor: pointer; }
      #send:hover:not(:disabled) { filter: brightness(1.15); }
      #send:disabled { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <div class="head">
      <span class="dot" id="dot"></span>
      <h1>Sunday</h1>
      <span class="state" id="state">…</span>
    </div>

    <div id="transcript">
      <div class="empty" id="empty">Ask Sunday anything about this browser, or just chat.</div>
    </div>

    <form id="form">
      <textarea id="input" rows="1" placeholder="Message Sunday…" autocomplete="off"></textarea>
      <button id="send" type="submit">Send</button>
    </form>

    <script src="sidepanel.js"></script>
  </body>
</html>
