<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sunday HUD</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- compact: a bar that extends the notch. center is the physical notch
       (empty); Sunday mark on the left shoulder, agent count on the right. -->
  <div class="notch" id="notch" data-mode="idle">
    <!-- compact bar: invisible when idle, fades in beside the notch when
         working, with the live agent count on the right shoulder. -->
    <div class="bar" id="bar">
      <div class="agents" id="agents-badge">
        <span class="spin"></span>
        <span class="count" id="agents-count">0</span>
      </div>
    </div>

    <!-- expanded: glass HUD card dropping from the notch -->
    <div class="hud" id="hud">
      <div class="hud-head">
        <img class="hud-mark" src="../renderer/sunday-mark.png" alt="">
        <span class="hud-name">Sunday</span>
        <span class="hud-conn mono" id="hud-conn">—</span>
      </div>
      <div class="hud-agents">
        <div class="hud-empty" id="hud-empty">Nothing running</div>
        <ul class="hud-agent-list" id="hud-agent-list"></ul>
      </div>
      <div class="hud-stats mono" id="hud-stats"></div>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
