<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunday</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" data-state="connecting" title="connecting…"></span>
      <span class="brand-name">Sunday</span>
    </div>
    <div class="status mono" id="status">connecting…</div>
    <div class="topbar-actions">
      <button id="settings-btn" class="iconbtn" title="Settings (⌘,)" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="admin-btn" class="iconbtn" title="System panel (⌘.)" aria-label="System panel">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M3 12h18M3 19h18"/></svg>
      </button>
    </div>
  </header>

  <aside class="panel" id="admin-panel" hidden aria-label="System panel">
    <div class="panel-head">
      <span class="panel-title">System</span>
      <button id="admin-close" class="iconbtn" title="Close (esc)" aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <section class="panel-sec" id="admin-daemon">
        <h3>Daemon</h3>
        <div class="kv mono" id="admin-daemon-grid"></div>
      </section>
      <section class="panel-sec" id="admin-satellites">
        <h3>Devices <span class="pill-count" id="admin-satellites-count">—</span></h3>
        <ul class="list" id="admin-satellites-list"><li class="empty">—</li></ul>
      </section>
      <section class="panel-sec" id="admin-memory">
        <h3>Memory <span class="pill-count" id="admin-memory-count">—</span></h3>
        <ul class="list" id="admin-memory-list"><li class="empty">—</li></ul>
      </section>
      <section class="panel-sec" id="admin-skills">
        <h3>Skills <span class="pill-count" id="admin-skills-count">—</span></h3>
        <ul class="list" id="admin-skills-list"><li class="empty">—</li></ul>
      </section>
      <section class="panel-sec" id="admin-activity">
        <h3>Recent activity</h3>
        <ul class="list" id="admin-activity-list"><li class="empty">—</li></ul>
      </section>
    </div>
  </aside>

  <main class="chat" id="chat" aria-live="polite" aria-label="Conversation"></main>

  <button class="jump-btn" id="jump-btn" hidden title="Jump to latest" aria-label="Jump to latest">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
  </button>

  <section class="dropzone" id="dropzone" hidden>
    <div class="dropzone-card">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
      <span>Drop to attach</span>
    </div>
  </section>

  <footer class="composer">
    <div class="attachments" id="attachments"></div>
    <div class="composer-row">
      <button id="attach-btn" class="iconbtn" title="Attach files" aria-label="Attach files">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a6 6 0 1 1-8.49-8.49L13.4 1.6a4 4 0 0 1 5.66 5.66L9.41 16.91a2 2 0 0 1-2.83-2.83l8.46-8.46"/></svg>
      </button>
      <input id="file-input" type="file" multiple hidden>
      <textarea id="composer" rows="1" placeholder="Message Sunday…" aria-label="Message"></textarea>
      <button id="mic-btn" class="iconbtn" title="Voice (one-shot)" aria-label="Voice input">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M9 22h6"/></svg>
      </button>
      <button id="send-btn" class="send-btn" title="Send (↵)" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="composer-hint mono" id="hint"><kbd>↵</kbd> send · <kbd>⇧↵</kbd> newline · <kbd>⌘,</kbd> settings</div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
