<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunday</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" data-state="connecting"></span>
      <span class="brand-name">Sunday</span>
    </div>
    <div class="status" id="status">connecting…</div>
    <button id="settings-btn" class="topbar-btn" title="settings (⌘,)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button id="admin-btn" class="topbar-btn" title="open admin console (⌘.)">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="12" r="2"/></svg>
    </button>
  </header>

  <aside class="admin-panel" id="admin-panel" hidden>
    <div class="admin-header">
      <span class="admin-title">Sunday — admin</span>
      <button id="admin-close" class="icon-btn" title="close (esc)">×</button>
    </div>
    <div class="admin-section" id="admin-daemon">
      <h3>Daemon</h3>
      <div class="admin-grid" id="admin-daemon-grid">…</div>
    </div>
    <div class="admin-section" id="admin-satellites">
      <h3>Satellites <span class="admin-count" id="admin-satellites-count">—</span></h3>
      <ul class="admin-list" id="admin-satellites-list"><li class="empty">—</li></ul>
    </div>
    <div class="admin-section" id="admin-memory">
      <h3>Memory <span class="admin-count" id="admin-memory-count">—</span></h3>
      <ul class="admin-list" id="admin-memory-list"><li class="empty">—</li></ul>
    </div>
    <div class="admin-section" id="admin-skills">
      <h3>Skills <span class="admin-count" id="admin-skills-count">—</span></h3>
      <ul class="admin-list" id="admin-skills-list"><li class="empty">—</li></ul>
    </div>
    <div class="admin-section" id="admin-activity">
      <h3>Recent tool activity</h3>
      <ul class="admin-list" id="admin-activity-list"><li class="empty">—</li></ul>
    </div>
  </aside>

  <main class="chat" id="chat" aria-live="polite"></main>

  <section class="dropzone" id="dropzone" hidden>
    <p>drop to attach</p>
  </section>

  <footer class="composer">
    <div class="attachments" id="attachments"></div>
    <div class="composer-row">
      <button id="attach-btn" class="icon-btn" title="attach files">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a6 6 0 1 1-8.49-8.49L13.4 1.6a4 4 0 0 1 5.66 5.66L9.41 16.91a2 2 0 0 1-2.83-2.83l8.46-8.46"/></svg>
      </button>
      <input id="file-input" type="file" multiple hidden>
      <textarea id="composer" rows="1" placeholder="message Sunday…"></textarea>
      <button id="mic-btn" class="icon-btn" title="voice">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M9 22h6"/></svg>
      </button>
      <button id="send-btn" class="primary" title="send">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14-7-7 14-2-5-5-2z"/></svg>
      </button>
    </div>
    <div class="composer-hint" id="hint">type or hit the mic to talk</div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
