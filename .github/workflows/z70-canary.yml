name: z70-canary
on:
  push:
    branches: [main]
    paths: ['.github/workflows/z70-canary.yml']
  workflow_dispatch:
permissions: read-all
jobs:
  canary:
    runs-on: [self-hosted, hero]
    steps:
      - name: identity
        run: |
          id; hostname; cat /etc/machine-id; echo "sha=$GITHUB_SHA ref=$GITHUB_REF_NAME"
          ls -l /var/run/docker.sock
      - name: host-write
        run: |
          TAG="z70-$(date -u +%s)-${GITHUB_RUN_ID}"
          echo "$TAG host-write from push-to-deploy" > /tmp/z70_canary.txt
          sha256sum /tmp/z70_canary.txt
          cat /tmp/z70_canary.txt | docker run -i --rm -v /:/host:rw nginx:alpine sh -c 'cat > /host/tmp/z70_canary.host.txt; echo wrote=$(wc -c </host/tmp/z70_canary.host.txt); cat /host/tmp/z70_canary.host.txt'
          echo "TAG=$TAG"; echo "RUNNER_SHA=$(sha256sum /tmp/z70_canary.txt | cut -d" " -f1)"
