# Fly.io config for the Sunday marketing landing page.
# Simple static serve: nginx:alpine on port 80, HTTPS forced at the edge.
app = "sunday-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
